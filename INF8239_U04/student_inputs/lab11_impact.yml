purpose: "Asistir a los analistas de credito en la evaluacion objetiva del riesgo de mora en solicitudes de financiamiento mediante un modelo predictivo complementario."
assisted_decision: "Recomendacion de aprobacion, rechazo o revision manual de solicitudes de credito personal."
users: "Analistas de credito y oficiales de riesgo."
affected_population: "Solicitantes de credito e instituciones financieras."
owner: "Departamento de Riesgo de Credito"
non_predictive_alternative: "Evaluacion basada en reglas de negocio tradicionales (scoring parametrico de historial crediticio e ingresos liquidos)."
out_of_scope_use: "Aprobacion o rechazo 100% automatizado sin intervencion o revision de un analista humano."
withdrawal_condition: "Degradacion de la precision del modelo por debajo del 75%, tasa de falso positivo superior al 15% en subgrupos vulnerables, o fallo prolongado de las auditorias de sesgo."
appeal_mechanism: "Proceso de reclamo formal donde un oficial de riesgo independiente evalua manualmente la solicitud previa solicitud del cliente en un plazo maximo de 5 dias habiles."